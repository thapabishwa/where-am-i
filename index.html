<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#667eea"/>
  <meta name="description" content="Discover your exact location using IP geolocation and GPS. Find your IP address, city, country, and see your location on an interactive map instantly!"/>

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Where Am I? - Location Finder"/>
  <meta property="og:description" content="Discover your exact location using IP geolocation and GPS. Find your IP address, city, country, and see your location on an interactive map instantly!"/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="/share.png"/>

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Where Am I? - Location Finder"/>
  <meta name="twitter:description" content="Discover your exact location using IP geolocation and GPS"/>
  <meta name="twitter:image" content="/share.png"/>

  <title>Where Am I? - Location Finder</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" href="/logo192.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="/logo512.png"/>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    .leaflet-container {
      height: 100%;
      width: 100%;
    }

    .info-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 30px;
      max-width: 420px;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .info-panel:hover {
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
      transform: translateX(-50%) translateY(-2px);
    }

    header {
      margin-bottom: 25px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 2em;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 0.95em;
      color: #666;
    }

    .info-card {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      transition: all 0.2s;
      border-left: 4px solid #667eea;
    }

    .info-card:hover {
      transform: translateX(4px);
      border-left-width: 6px;
    }

    .info-card:last-child {
      margin-bottom: 0;
    }

    .info-icon {
      font-size: 1.8em;
      margin-right: 15px;
      min-width: 45px;
      text-align: center;
    }

    .info-content {
      flex: 1;
    }

    .info-label {
      font-weight: 600;
      color: #667eea;
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 1em;
      color: #333;
      word-break: break-word;
      line-height: 1.4;
    }

    .loading {
      color: #999;
      font-style: italic;
    }

    .error {
      color: #e74c3c;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(102, 126, 234, 0.3);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .info-panel {
        bottom: 10px;
        left: 10px;
        right: 10px;
        max-width: none;
        padding: 20px;
        transform: none;
      }

      h1 {
        font-size: 1.6em;
      }

      .subtitle {
        font-size: 0.85em;
      }

      .info-card {
        padding: 14px;
      }

      .info-icon {
        font-size: 1.5em;
        min-width: 40px;
      }
    }

    /* Collapse panel on very small screens */
    @media (max-width: 480px) {
      .info-panel {
        padding: 15px;
      }

      header {
        margin-bottom: 15px;
        padding-bottom: 15px;
      }

      h1 {
        font-size: 1.4em;
      }

      .info-card {
        padding: 12px;
        margin-bottom: 10px;
      }

      .info-icon {
        font-size: 1.3em;
        margin-right: 10px;
        min-width: 35px;
      }

      .info-label {
        font-size: 0.75em;
      }

      .info-value {
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to use this application.</noscript>

  <!-- Full-screen map -->
  <div id="map"></div>

  <!-- Floating info panel -->
  <div class="info-panel">
    <header>
      <h1>🌍 Where Am I?</h1>
      <p class="subtitle">Your location information</p>
    </header>

    <div class="info-card">
      <div class="info-icon">🌐</div>
      <div class="info-content">
        <div class="info-label">Your IP Address</div>
        <div class="info-value" id="ip"><span class="spinner"></span> Loading...</div>
      </div>
    </div>

    <div class="info-card">
      <div class="info-icon">📍</div>
      <div class="info-content">
        <div class="info-label">IP Location</div>
        <div class="info-value" id="geo"><span class="spinner"></span> Loading...</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const ipEl = document.getElementById("ip");
    const geoEl = document.getElementById("geo");
    let map;

    fetch("https://ipapi.co/json/")
      .then(res => res.json())
      .then(data => {
        ipEl.textContent = data.ip;

        if (!data.latitude || !data.longitude) {
          geoEl.innerHTML = '<span class="error">Unable to fetch location</span>';
          return;
        }

        geoEl.textContent = `${data.city}, ${data.region}, ${data.country_name} (${data.latitude.toFixed(4)}, ${data.longitude.toFixed(4)})`;

        map = L.map("map").setView([data.latitude, data.longitude], 13);

        // Use CartoDB Voyager tiles for a modern, clean look (no API key needed)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 20
        }).addTo(map);

        // Add custom marker with better styling
        L.marker([data.latitude, data.longitude], {
          icon: L.divIcon({
            html: '<div style="font-size: 40px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">📍</div>',
            className: 'emoji-marker',
            iconSize: [40, 40],
            iconAnchor: [20, 40]
          })
        }).addTo(map).bindPopup(`<b>📍 Your IP Location</b><br>${data.city}, ${data.country_name}`);
      })
      .catch(error => {
        console.error("Error:", error);
        ipEl.innerHTML = '<span class="error">Failed to load</span>';
        geoEl.innerHTML = '<span class="error">Failed to load</span>';
      });
  </script>
</body>
</html>
