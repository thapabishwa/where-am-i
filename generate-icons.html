<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Icon Generator</title>
</head>
<body>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <canvas id="canvas32" width="32" height="32"></canvas>
  <div id="downloads"></div>

  <script>
    function generateIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      // Draw location pin emoji
      ctx.font = `${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🌍', size / 2, size / 2);

      return canvas;
    }

    // Generate icons
    const canvas192 = generateIcon('canvas192', 192);
    const canvas512 = generateIcon('canvas512', 512);
    const canvas32 = generateIcon('canvas32', 32);

    // Create download links
    const downloads = document.getElementById('downloads');

    canvas192.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'logo192.png';
      link.textContent = 'Download logo192.png';
      link.style.display = 'block';
      link.style.margin = '10px';
      downloads.appendChild(link);
    });

    canvas512.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'logo512.png';
      link.textContent = 'Download logo512.png';
      link.style.display = 'block';
      link.style.margin = '10px';
      downloads.appendChild(link);
    });

    canvas32.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'favicon.ico';
      link.textContent = 'Download favicon.ico';
      link.style.display = 'block';
      link.style.margin = '10px';
      downloads.appendChild(link);
    });
  </script>
</body>
</html>
